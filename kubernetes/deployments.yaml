apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestures
  labels:
    app: gestures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestures
  template:
    metadata:
      labels:
        app: gestures
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: gestures
          image: ghcr.io/aihpi/demo-visionary-gestures:sha-2dfa16d
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          volumeMounts:
            - name: huggingface-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: huggingface-cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: gestures
  labels:
    app: gestures
spec:
  selector:
    app: gestures
  ports:
    - name: http
      port: 80
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestures-ui
  labels:
    app: gestures-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestures-ui
  template:
    metadata:
      labels:
        app: gestures-ui
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: gestures-ui
          image: ghcr.io/aihpi/demo-visionary-gestures-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: gestures-ui
  labels:
    app: gestures-ui
spec:
  selector:
    app: gestures-ui
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gestures-ingress
  labels:
    app: gestures
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: gestures.aisc.hpi.de
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gestures
                port:
                  number: 80
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: gestures
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gestures-ui
                port:
                  number: 80
