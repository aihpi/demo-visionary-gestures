apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestures-ui
  labels:
    app: gestures-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestures-ui
  template:
    metadata:
      labels:
        app: gestures-ui
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: gestures-ui
          image: ghcr.io/aihpi/demo-visionary-gestures:sha-db7d596
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: gestures-ui
  labels:
    app: gestures-ui
spec:
  selector:
    app: gestures-ui
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gestures-ingress
  labels:
    app: gestures-ui
spec:
  rules:
    - host: gestures.aisc.hpi.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gestures-ui
                port:
                  number: 80
