name: Build and Push demo-visionary-gestures Image

env:
  BACKEND_IMAGE: ghcr.io/aihpi/demo-visionary-gestures
  FRONTEND_IMAGE: ghcr.io/aihpi/demo-visionary-gestures-ui
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_BUILD_SUMMARY: false

on:
  push:
    branches:
      - main
    paths:
      - 01_frontend/**
      - 02_backend/**
      - kubernetes/**
      - .gitattributes
      - .github/workflows/publish-ui-image.yml
  workflow_dispatch:

concurrency:
  group: demo-visionary-gestures-image-main
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ────────────────────────────────────────────────────────────────

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push backend (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./02_backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── Frontend ───────────────────────────────────────────────────────────────

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push frontend (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./01_frontend
          file: ./01_frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ── Manifest update ────────────────────────────────────────────────────────

      - name: Update Kubernetes manifest
        id: update_manifest
        run: |
          BACKEND_TAG=$(echo '${{ steps.meta-backend.outputs.json }}' | jq -r '.tags[] | select(contains("sha-"))' | cut -d':' -f2)
          FRONTEND_TAG=$(echo '${{ steps.meta-frontend.outputs.json }}' | jq -r '.tags[] | select(contains("sha-"))' | cut -d':' -f2)

          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"

          TARGET_FILE="kubernetes/deployments.yaml"

          sed -i "s|image: ${{ env.BACKEND_IMAGE }}:.*|image: ${{ env.BACKEND_IMAGE }}:${BACKEND_TAG}|g" "$TARGET_FILE"
          sed -i "s|image: ${{ env.FRONTEND_IMAGE }}:.*|image: ${{ env.FRONTEND_IMAGE }}:${FRONTEND_TAG}|g" "$TARGET_FILE"

      - name: Commit and push manifest changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BACKEND_TAG="${{ steps.update_manifest.outputs.backend_tag }}"
          FRONTEND_TAG="${{ steps.update_manifest.outputs.frontend_tag }}"

          if git diff --exit-code kubernetes/deployments.yaml; then
            echo "No changes to manifest. Skipping commit."
          else
            git add kubernetes/deployments.yaml
            git commit -m "chore: update images backend=${BACKEND_TAG} frontend=${FRONTEND_TAG} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
